# Yerel üretim benzeri ortam: docker compose up --build
# Site: http://localhost:8080
services:
  app:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: "8080"
      HOST: 0.0.0.0
      PUBLIC_BASE_URL: http://localhost:8080
      SITE_URL: http://localhost:8080
      MONGODB_URI: mongodb://mongo:27017/
      MONGODB_DB: rota-kars
      # Yerelde örnek seferlerle denemek için. Railway'de 0 bırakın.
      SEED_DEMO: "1"
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
  # MongoDB: Railway'deki gibi tek düğüm. Bilgisayardan `npm run dev` ile
  # bağlanmak için MONGODB_URI=mongodb://127.0.0.1:27017/
  mongo:
    image: mongo:8.0
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped
volumes:
  mongo-data:
